name: Refresh decisions.json

on:
  schedule:
    # Weekdays at 06:40 UTC (GitHub may start scheduled runs a little late)
    - cron: "40 6 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build.py
      - dismissed.json
      - .github/workflows/refresh.yml

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build decisions.json
        run: python3 build.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decisions.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Refresh decisions.json ($(date -u +%F))"
            git pull --rebase
            git push
          fi
      - name: Purge jsDelivr cache
        run: curl -sS -m 30 "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/decisions.json" || true
